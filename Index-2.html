<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taco Miami Taqueria - Daily Checklist</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: auto;
      padding: 20px;
      background: #fff8e7;
      color: #222;
    }
    h1 {
      text-align: center;
    }
    .item {
      background: white;
      margin: 10px 0;
      padding: 15px;
      border-radius: 10px;
      font-size: 18px;
    }
    input {
      transform: scale(1.5);
      margin-right: 15px;
    }
  </style>
</head>
<body>

<h1>🌮 Taco Miami Taqueria</h1>
<h2>Daily Checklist</h2>

<div class="item"><input type="checkbox"> Check Clover POS</div>
<div class="item"><input type="checkbox"> Check cash and sales</div>
<div class="item"><input type="checkbox"> Check food inventory</div>
<div class="item"><input type="checkbox"> Check drinks</div>
<div class="item"><input type="checkbox"> Check supplies</div>
<div class="item"><input type="checkbox"> Confirm today's location</div>
<div class="item"><input type="checkbox"> Prepare food truck</div>
<div class="item"><input type="checkbox"> Record daily sales</div>

</body>
</html>
